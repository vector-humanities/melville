<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Melville Research Bench</title>
  <meta name="description" content="A research bench by David M. Berry and Michael Jonik for Herman Melville’s Billy Budd and short tales: read the manuscript’s states and the editions, compare, annotate and export.">
  <!-- Bench version: the ?v= on every script and stylesheet below. Raise it by
       0.0.1 on every push that changes the bench, all tags alike, so browsers
       fetch fresh copies. kit/base.js reads it from its own tag. Set bench-date to
       the day of the release; the About box (kit/about.js) shows both. -->
  <meta name="bench-date" content="2026-10-31">
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
  <link rel="stylesheet" href="kit/bench.css?v=0.2.7">
  <link rel="stylesheet" href="kit/themes.css?v=0.2.7">
  <link rel="stylesheet" href="css/research.css?v=0.2.7">
  <link rel="stylesheet" href="kit/paratexts.css?v=0.2.7">
  <link rel="stylesheet" href="kit/kit.css?v=0.2.7">
  <link rel="stylesheet" href="kit/book.css?v=0.2.7">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./" title="About the bench">
      <img src="img/icon.svg" alt="" width="26" height="26">
      <span class="brand-name"><b>Melville</b> <b>research bench</b></span>
      <span class="bench-ver" id="bench-ver"></span>
    </a>
    <div class="bar-right">
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <span class="size-btns"><button class="icon-btn" id="btn-smaller" title="Smaller text">A−</button><button class="icon-btn" id="btn-larger" title="Larger text">A+</button></span>
      <button class="icon-btn" id="btn-theme" title="Switch between your last light and dark colour themes (choose themes in ⚙ Settings)">◐</button>
      <button class="icon-btn" id="btn-code" title="Go to a code: an annotation (A-, R-), a finding (C-, F), a note (initials-N)">#</button>
      <button class="icon-btn news-btn" id="btn-news" title="What’s new in the group’s annotations">✉<span class="news-n" id="news-n"></span></button>
      <!-- About is in the Help menu; this hidden button carries its handler -->
      <button class="icon-btn" id="btn-about" hidden>ⓘ</button>
      <button class="icon-btn" id="btn-settings" title="Your initials and the Hypothesis group, colour theme, text font and size">⚙</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-menu="read" data-tabs="read" class="on" aria-expanded="false" title="Read a version: the versions in their groups">Read <span class="caret" aria-hidden="true">▾</span></button>
    <button data-tab="book" title="The text set as a page; the manuscript through its stages of revision">Book</button>
    <button data-menu="text" data-tabs="analyse" aria-expanded="false" title="Lenses on the text: revisions by leaf, words, in this version and across the versions">Text <span class="caret" aria-hidden="true">▾</span></button>
    <button data-menu="versions" data-tabs="about compare genealogy" aria-expanded="false" title="The version open, comparison, genealogy">Versions <span class="caret" aria-hidden="true">▾</span></button>
    <button data-tab="findings" title="What the bench and the group have established, with evidence; shared">Findings</button>
    <button data-tab="notes" title="What you have gathered for writing: figures, excerpts, findings, paragraphs; private, in this browser">My notes</button>
    <button data-tab="paratexts" title="The scans, letters, reviews and documents around the texts, shared with the group">Paratexts</button>
    <button data-menu="help" aria-expanded="false" title="About the bench, settings, the code">Help <span class="caret" aria-hidden="true">▾</span></button>
  </nav>
  <noscript><div class="noscript">The research bench runs in JavaScript, which is turned off in this browser. Its texts are the Melville Electronic Library’s, at <a href="https://melville.electroniclibrary.org/versions-of-billy-budd">melville.electroniclibrary.org</a>.</div></noscript>

  <main id="main">
    <section class="view on" id="view-read"></section>
    <section class="view" id="view-book"></section>
    <section class="view" id="view-analyse"></section>
    <section class="view" id="view-functional"></section>
    <section class="view" id="view-compare"></section>
    <section class="view" id="view-genealogy"></section>
    <section class="view" id="view-about"></section>
    <section class="view" id="view-findings"></section>
    <section class="view" id="view-notes"></section>
    <section class="view" id="view-paratexts"></section>
  </main>
